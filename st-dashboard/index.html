<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Screw Trajectory Dashboard — runs the exact Python script in the browser via Pyodide.">
<title>Screw Trajectory Dashboard</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: Arial, Helvetica, sans-serif; padding: 20px; background: #f5f7fa; color: #222; }
  h1 { font-size: 1.3rem; }
  .sub { color: #666; font-size: 0.85rem; margin: 4px 0 16px; }
  .status { font-size: 0.85rem; color: #555; margin-bottom: 12px; font-family: monospace; }
  .status .dot { display:inline-block; width:10px; height:10px; border-radius:50%; background:#f0ad4e; margin-right:6px; }
  .status.running .dot { background:#00e676; animation: pulse 1s infinite; }
  .status.done .dot { background:#28a745; }
  .status.error .dot { background:#d9534f; }
  @keyframes pulse { 50% { opacity: 0.3; } }
  img.dash { max-width: 100%; border: 1px solid #ccc; border-radius: 8px; background: #fff; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
  .card { background: #fff; border: 1px solid #ddd; border-radius: 8px; padding: 14px; margin-top: 16px; }
  .card h2 { font-size: 0.95rem; text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 10px; }
  pre.out { background: #0d1117; color: #e8e8f0; padding: 12px; border-radius: 6px; font-size: 0.82rem; overflow-x: auto; }
  .btn { display:inline-block; padding: 7px 14px; border: 1px solid #888; border-radius: 6px; background: #fff; color:#333; text-decoration:none; font-size: 0.82rem; cursor:pointer; margin-right: 8px; }
  .btn:hover { background: #eef; }
  .mono { font-family: monospace; }
</style>
</head>
<body>

<h1>Screw Trajectory Dashboard</h1>


<div id="status" class="status"><span class="dot"></span><span id="status-text">Loading Python runtime (numpy + scipy + matplotlib) — first load downloads ~40&nbsp;MB, please wait…</span></div>

<div id="result" style="display:none">
  <img id="dash-img" class="dash" alt="Screw trajectory dashboard output">
  <div class="card">
    <h2>Outputs (printed by the script)</h2>
    <pre id="stdout" class="out"></pre>
  </div>
  <div class="card">
    <h2>Source</h2>
    <a id="dl" class="btn" download="screw_trajectory_dashboard.py">Download screw_trajectory_dashboard.py</a>
    <a id="view" class="btn" href="screw_trajectory_dashboard.py" target="_blank">View source</a>
  </div>
</div>

<div id="error" style="display:none" class="card">
  <h2>Error</h2>
  <pre id="error-text" class="out"></pre>
</div>

<script src="https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js"></script>
<script>
async function setStatus(msg, cls) {
  const el = document.getElementById('status');
  el.className = 'status' + (cls ? ' ' + cls : '');
  document.getElementById('status-text').textContent = msg;
}

async function main() {
  try {
    const pyRes = await fetch('screw_trajectory_dashboard.py');
    if (!pyRes.ok) throw new Error('Failed to fetch screw_trajectory_dashboard.py: HTTP ' + pyRes.status);
    const pyCode = await pyRes.text();

    await setStatus('Loading Pyodide…');
    const pyodide = await loadPyodide();

    await setStatus('Loading scipy (numpy)…');
    await pyodide.loadPackage('scipy');
    await setStatus('Loading matplotlib…');
    await pyodide.loadPackage('matplotlib');

    pyodide.FS.writeFile('screw_trajectory_dashboard.py', pyCode);

    await setStatus('Running screw_trajectory_dashboard.py (unmodified)…', 'running');

    const payload = await pyodide.runPythonAsync(`
import os
os.environ['MPLBACKEND'] = 'Agg'
import sys, io, json, base64
import matplotlib
matplotlib.use('Agg')
sys.stdout = io.StringIO()
code = open('screw_trajectory_dashboard.py').read()
ns = {'__name__': '__main__'}
try:
    exec(compile(code, 'screw_trajectory_dashboard.py', 'exec'), ns)
    out = sys.stdout.getvalue()
    fig = ns['fig']
    buf = io.BytesIO()
    fig.savefig(buf, format='png', dpi=160, bbox_inches='tight')
    payload = '__RESULT__' + json.dumps({'stdout': out, 'png': base64.b64encode(buf.getvalue()).decode()})
except BaseException:
    import traceback
    payload = '__ERROR__' + traceback.format_exc()
payload
`);

    if (payload.startsWith('__ERROR__')) throw new Error(payload.slice(9));
    const parsed = JSON.parse(payload.slice(9));
    document.getElementById('dash-img').src = 'data:image/png;base64,' + parsed.png;
    document.getElementById('stdout').textContent = parsed.stdout;
    document.getElementById('dl').href = 'data:text/plain;base64,' + btoa(unescape(encodeURIComponent(pyCode)));
    document.getElementById('result').style.display = 'block';
    await setStatus('Done — exact Python output rendered below.', 'done');
  } catch (err) {
    document.getElementById('error-text').textContent = String(err && err.stack || err);
    document.getElementById('error').style.display = 'block';
    await setStatus('Failed to run the script.', 'error');
  }
}

main();
</script>
</body>
</html>
